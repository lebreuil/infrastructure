apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # Source 1 — Helm chart pulled directly from the official podinfo repo
    - repoURL: https://stefanprodan.github.io/podinfo
      chart: podinfo
      targetRevision: "6.7.0"
      helm:
        valueFiles:
          - $values/deploy/values.yaml

    # Source 2 — values and additional manifests from your GitHub repo
    # Referenced as $values in the helm.valueFiles above
    - repoURL: https://github.com/lebreuil/podinfo-test-repo
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true