# Argo CD Helm values
#
# Networking strategy:
#   Argo CD is exposed via the shared NGINX Ingress Controller.
#   TLS is terminated at the NGINX level using a certificate provisioned
#   by cert-manager. The --insecure flag disables Argo CD's built-in TLS.
#
# GitHub App authentication:
#   External Secrets Operator synchronizes the GitHub App credentials from
#   OpenBao into an Argo CD repo-creds Secret in the argocd namespace.
#   The Secret covers all repositories in the organisation automatically.
#
# Node scheduling:
#   All Argo CD components run on management nodes to keep worker nodes
#   dedicated to application workloads.

server:
  extraArgs:
    - --insecure
  service:
    type: ClusterIP
  nodeSelector:
    custom.kaas.infomaniak.cloud/node-role: "management"

repoServer:
  nodeSelector:
    custom.kaas.infomaniak.cloud/node-role: "management"

applicationSet:
  nodeSelector:
    custom.kaas.infomaniak.cloud/node-role: "management"

controller:
  nodeSelector:
    custom.kaas.infomaniak.cloud/node-role: "management"

dex:
  nodeSelector:
    custom.kaas.infomaniak.cloud/node-role: "management"

notifications:
  nodeSelector:
    custom.kaas.infomaniak.cloud/node-role: "management"

redis:
  nodeSelector:
    custom.kaas.infomaniak.cloud/node-role: "management"
