# OpenBao Helm chart values
#
# OpenBao is an open source secret manager (fork of HashiCorp Vault)
# deployed as cluster infrastructure to provide secret management for
# all applications deployed via Argo CD.
#
# Ingress:
#   Not managed here — defined as a separate kubernetes_ingress_v1
#   resource in openbao.tf so it follows the same pattern as all
#   other platform services.
#
# Storage:
#   File storage persisted on a PVC backed by OpenStack Cinder.
#
# TLS:
#   TLS is disabled on the listener since NGINX Ingress handles
#   TLS termination externally.
#
# nodeSelector:
#   OpenBao runs on management nodes alongside other infrastructure
#   components to keep worker nodes dedicated to application workloads.

global:
  enabled: true

server:
  dev:
    enabled: false

  ha:
    enabled: false

  standalone:
    enabled: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address     = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/openbao/data"
      }

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  nodeSelector:
    custom.kaas.infomaniak.cloud/node-role: "management"

ui:
  enabled: true
  serviceType: ClusterIP

injector:
  enabled: true
  nodeSelector:
    custom.kaas.infomaniak.cloud/node-role: "management"

csi:
  enabled: false